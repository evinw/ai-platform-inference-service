name: ci

on:
  push:
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check app

      - name: Smoke test import
        run: |
          python -c "from app.main import app; print('ok')"

      - name: Docker build
        run: |
          docker build -t inference-service:ci .
